services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/mood_treehole.db
    volumes:
      - ./backend/mood_treehole.db:/data/mood_treehole.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
    restart: unless-stopped
